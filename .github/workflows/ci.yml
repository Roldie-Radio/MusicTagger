# The test suite, on every push and pull request.
#
# The release workflow also runs the suite, but only when something is being
# shipped - which means a broken commit sits on main undetected until the next
# release attempt. This catches it at the push instead.
#
# Both platforms, deliberately. The one test failure this repo has actually
# had was a Windows path literal that passed on Windows and failed everywhere
# else; a single-OS matrix would not have seen it.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false      # one platform failing must not hide the other's result
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Without ffmpeg the audio fixtures cannot be built, so ~118 tests skip
      # and the suite still exits 0 - a green run that quietly checked a third
      # less than it looks like. Fail loudly instead of passing weakly.
      - name: ffmpeg must be available
        run: |
          python -c "import shutil, sys; p = shutil.which('ffmpeg'); print('ffmpeg:', p); sys.exit(0 if p else 'ffmpeg not on PATH - the suite would silently skip its audio tests')"

      - name: Run tests
        run: python -m pytest
