# Builds and publishes the Windows installer.
#
# The in-app update check (musictag/update.py) reads GitHub Releases, so this
# workflow is what makes that feature do anything at all: no release, nothing
# to find.
#
# Two ways in, because pushing a tag is not always available - some tokens are
# scoped to refs/heads/ and are refused on refs/tags/:
#
#   1. Push a tag (`git tag v0.2.0 && git push origin v0.2.0`). The guard step
#      below refuses the build if the tag and the declared version disagree.
#   2. Run this workflow by hand from any branch. No tag needed: the version
#      comes from musictag/__init__.py, and publishing the resulting draft
#      release is what creates the tag, because GitHub's Releases API mints a
#      tag that does not exist yet when a release naming it is published.
#
# Either way electron-builder uploads to a DRAFT release, so the installer can
# be checked before anything becomes public - and until that draft is
# published, /releases/latest keeps returning 404 and the in-app check keeps
# correctly reporting that there is nothing to update to.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write          # creating the Release is a write to the repo

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/electron/package-lock.json

      # --- the version the installer claims must be the version tagged -----
      # An installer stamped 0.1.0 published under tag v0.2.0 makes the update
      # check permanently wrong: everyone who installs it is told they are on
      # 0.1.0 and offered 0.2.0 forever. Cheaper to fail here.
      - name: Tag must match the declared version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(python -c "import musictag; print(musictag.__version__)")
          echo "tag=$tag declared=$declared"
          if [ "$tag" != "$declared" ]; then
            echo "::error::Tag v$tag does not match musictag/__init__.py ($declared)"
            exit 1
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pyinstaller

      # --- bundled tools ---------------------------------------------------
      # The downloads desktop/build-resources/tools/README.md documents. They
      # are gitignored (~200MB) so CI fetches them the same way a human would.
      #
      # FFMPEG_VERSION pins which ffmpeg gets bundled. The README's
      # ffmpeg-release-essentials.zip always serves whatever is newest, so two
      # builds of the same commit could ship different ffmpeg binaries and
      # nothing would say so. Leave it empty to track latest; set it to a
      # version (e.g. "8.0") to pin. Either way the version actually bundled
      # is resolved, asserted and printed below, so the build always states
      # what went into it.
      - name: Fetch ffmpeg and fpcalc
        shell: pwsh
        env:
          FFMPEG_VERSION: ''
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = "desktop/build-resources/tools"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null

          $wanted = $env:FFMPEG_VERSION
          if ($wanted) {
            $url = "https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-$wanted-essentials_build.zip"
          } else {
            $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          }
          Write-Host "ffmpeg source: $url"
          curl.exe -L --fail -o ffmpeg.zip $url
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg download failed ($url)" }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp -Force
          Copy-Item (Get-ChildItem -Recurse -Filter ffmpeg.exe ffmpeg-tmp)[0].FullName $tools
          Copy-Item (Get-ChildItem -Recurse -Filter ffprobe.exe ffmpeg-tmp)[0].FullName $tools

          curl.exe -L --fail -o fpcalc.zip https://github.com/acoustid/chromaprint/releases/download/v1.5.1/chromaprint-fpcalc-1.5.1-windows-x86_64.zip
          if ($LASTEXITCODE -ne 0) { throw "fpcalc download failed" }
          Expand-Archive fpcalc.zip -DestinationPath fpcalc-tmp -Force
          Copy-Item (Get-ChildItem -Recurse -Filter fpcalc.exe fpcalc-tmp)[0].FullName $tools

          # What actually got bundled, from the binary itself rather than from
          # the filename - a URL that quietly redirects elsewhere is caught here.
          $banner = (& "$tools/ffmpeg.exe" -version | Select-Object -First 1)
          Write-Host "bundled: $banner"
          if ($banner -notmatch 'ffmpeg version (\S+)') { throw "could not read ffmpeg version" }
          $got = $Matches[1]
          if ($wanted -and $got -notlike "$wanted*") {
            throw "asked for ffmpeg $wanted but bundled $got"
          }
          "FFMPEG_BUNDLED=$got" | Out-File -Append -FilePath $env:GITHUB_ENV
          Write-Host "::notice::Bundled ffmpeg $got (pin with FFMPEG_VERSION to make this reproducible)"

          Get-ChildItem $tools

      # --- gate the release on the suite -----------------------------------
      # ffmpeg is on PATH by the step above, so the 118 tests that skip
      # without it run here. This is the only place they run automatically.
      - name: Run tests
        shell: pwsh
        run: |
          $env:PATH = "$PWD/desktop/build-resources/tools;$env:PATH"
          python -m pytest

      - name: Freeze the backend
        run: python -m PyInstaller desktop/backend/backend.spec --distpath desktop/dist --workpath desktop/build --noconfirm

      # --- does the thing we ship actually start? --------------------------
      # The tests above run against the source. This runs the frozen binary,
      # which is a different artifact and can fail in ways the source cannot:
      # a hidden import PyInstaller did not find builds, packages and
      # publishes perfectly happily, then dies on a user's machine. This is
      # the check desktop/README.md describes doing by hand.
      - name: Smoke-test the frozen backend
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "desktop/dist/musictagger-backend/musictagger-backend.exe"
          if (-not (Test-Path $exe)) { throw "frozen backend missing at $exe" }

          # A throwaway home, so a CI run can never read or write real app data.
          $env:MUSICTAGGER_HOME = Join-Path $env:RUNNER_TEMP "mt-smoke"
          $out = Join-Path $env:RUNNER_TEMP "backend-out.txt"
          $err = Join-Path $env:RUNNER_TEMP "backend-err.txt"

          $proc = Start-Process -FilePath $exe -PassThru -NoNewWindow `
                                -RedirectStandardOutput $out -RedirectStandardError $err

          $port = $null
          foreach ($i in 1..60) {
            Start-Sleep -Milliseconds 500
            if (Test-Path $out) {
              $m = Select-String -Path $out -Pattern 'MUSICTAGGER_PORT=(\d+)' | Select-Object -First 1
              if ($m) { $port = $m.Matches[0].Groups[1].Value; break }
            }
            if ($proc.HasExited) { break }
          }

          if (-not $port) {
            Write-Host "--- stdout ---"; if (Test-Path $out) { Get-Content $out }
            Write-Host "--- stderr ---"; if (Test-Path $err) { Get-Content $err }
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
            throw "Frozen backend never reported a port - it did not start"
          }

          try {
            $status = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/status" -TimeoutSec 20
            $declared = (python -c "import musictag; print(musictag.__version__)").Trim()
            Write-Host "frozen backend answered on $port, version $($status.version)"

            if (-not $status.version) { throw "/api/status returned no version" }
            if ($status.version -ne $declared) {
              throw "frozen backend reports $($status.version) but the source declares $declared"
            }
            # Proves the real app config loaded, not just that something served HTTP.
            if (-not $status.supported_formats) { throw "/api/status listed no supported formats" }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Build and publish the installer
        working-directory: desktop/electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npm run dist -- --publish always
