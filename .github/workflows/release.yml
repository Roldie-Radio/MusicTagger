# Builds and publishes the Windows installer.
#
# The in-app update check (musictag/update.py) and the desktop auto-updater
# (desktop/electron/updater.js) both read GitHub Releases, so this workflow is
# what makes either do anything at all: no release, nothing to find.
#
# electron-builder uploads latest.yml and the installer's .blockmap next to the
# installer. Those are what installed copies download to learn about, and
# verify, a new version - a release without them cannot be auto-updated to.
#
# Two ways in, because pushing a tag is not always available - some tokens are
# scoped to refs/heads/ and are refused on refs/tags/:
#
#   1. Push a tag (`git tag v0.2.0 && git push origin v0.2.0`). The guard step
#      below refuses the build if the tag and the declared version disagree.
#   2. Run this workflow by hand from any branch. No tag needed: the version
#      comes from musictag/__init__.py, and publishing the resulting draft
#      release is what creates the tag, because GitHub's Releases API mints a
#      tag that does not exist yet when a release naming it is published.
#
# Either way electron-builder uploads to a DRAFT release, so the installer can
# be checked before anything becomes public - and until that draft is
# published, nothing sees it: /releases/latest keeps returning 404 and no
# installed copy updates to it. A manual run with "publish" ticked skips the
# draft stage and makes the release live as soon as the build succeeds.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the release straight away instead of leaving a draft'
        type: boolean
        default: false

permissions:
  contents: write          # creating the Release is a write to the repo

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/electron/package-lock.json

      # --- the version the installer claims must be the version tagged -----
      # An installer stamped 0.1.0 published under tag v0.2.0 makes the update
      # check permanently wrong: everyone who installs it is told they are on
      # 0.1.0 and offered 0.2.0 forever. Cheaper to fail here.
      - name: Tag must match the declared version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(python -c "import musictag; print(musictag.__version__)")
          echo "tag=$tag declared=$declared"
          if [ "$tag" != "$declared" ]; then
            echo "::error::Tag v$tag does not match musictag/__init__.py ($declared)"
            exit 1
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pyinstaller

      # --- bundled tools ---------------------------------------------------
      # Same downloads desktop/build-resources/tools/README.md documents. They
      # are gitignored (~200MB) so CI fetches them the same way a human would.
      - name: Fetch ffmpeg and fpcalc
        shell: pwsh
        run: |
          $tools = "desktop/build-resources/tools"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null

          curl.exe -L --fail -o ffmpeg.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp -Force
          Copy-Item (Get-ChildItem -Recurse -Filter ffmpeg.exe ffmpeg-tmp)[0].FullName $tools
          Copy-Item (Get-ChildItem -Recurse -Filter ffprobe.exe ffmpeg-tmp)[0].FullName $tools

          curl.exe -L --fail -o fpcalc.zip https://github.com/acoustid/chromaprint/releases/download/v1.5.1/chromaprint-fpcalc-1.5.1-windows-x86_64.zip
          Expand-Archive fpcalc.zip -DestinationPath fpcalc-tmp -Force
          Copy-Item (Get-ChildItem -Recurse -Filter fpcalc.exe fpcalc-tmp)[0].FullName $tools

          Get-ChildItem $tools

      # --- gate the release on the suite -----------------------------------
      # ffmpeg is on PATH by the step above, so the 140 tests that skip
      # without it run here as well as in tests.yml, so a release is never
      # built from code the full suite has not passed on.
      - name: Run tests
        shell: pwsh
        run: |
          $env:PATH = "$PWD/desktop/build-resources/tools;$env:PATH"
          python -m pytest

      - name: Freeze the backend
        run: python -m PyInstaller desktop/backend/backend.spec --distpath desktop/dist --workpath desktop/build --noconfirm

      - name: Build and publish the installer
        working-directory: desktop/electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npm run dist -- --publish always

      # Turns the draft electron-builder just made into a published release,
      # which creates the tag at the commit this run built. Published is what
      # installed copies look for, so this is the moment they start updating.
      - name: Publish the release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(python -c "import musictag; print(musictag.__version__)")
          gh release edit "v$version" --repo "$GITHUB_REPOSITORY" \
            --draft=false --latest --target "$GITHUB_SHA"
